stages:
  - lint
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

lint:
  stage: lint
  image: python:3.11-slim
  script:
    - pip install flake8
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,__pycache__
  allow_failure: true

test:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update -y && apt-get install -y libusb-1.0-0-dev libhidapi-dev udev
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install -r requirements.txt
  script:
    - python -c "import app, updater, config; print('Electra modules import successfully!')"
